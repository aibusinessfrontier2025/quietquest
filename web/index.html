<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>QuietQuest</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2314171c'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23e9b872'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/styles.css" />
    <script>
      // Apply a saved theme before first paint so the page never flashes the wrong one.
      try {
        const saved = localStorage.getItem('qq-theme');
        if (saved) document.documentElement.dataset.theme = saved;
      } catch {}
    </script>
  </head>
  <body>
    <div class="app" id="app" data-pane="chat">
      <section class="chat" aria-label="Conversation with your manager">
        <header class="chat-head">
          <div class="avatar" aria-hidden="true"><span></span></div>
          <div class="chat-id">
            <h1 id="pm-name">Chief</h1>
            <p id="pm-status">Your project manager</p>
          </div>
          <button class="icon-btn" id="pm-stop" hidden title="Stop the current turn" aria-label="Stop the current turn"></button>
        </header>
        <div class="chat-scroll" id="chat-scroll">
          <div class="chat-list" id="chat-list" aria-live="polite"></div>
        </div>
        <form class="composer" id="composer">
          <textarea id="composer-input" rows="1" placeholder="Tell Chief what you're working on…" aria-label="Message your manager"></textarea>
          <button class="send" type="submit" id="composer-send" aria-label="Send"></button>
        </form>
      </section>

      <main class="board">
        <header class="topbar">
          <div class="brand"><span class="brand-mark" aria-hidden="true"></span>QuietQuest</div>
          <nav class="tabs" id="tabs" aria-label="Views"></nav>
          <div class="topbar-right">
            <div class="providers" id="providers"></div>
            <button class="icon-btn" id="theme-toggle" title="Switch theme" aria-label="Switch theme"></button>
            <button class="icon-btn" id="open-settings" title="Settings" aria-label="Settings"></button>
          </div>
        </header>
        <div class="banner" id="banner" hidden></div>
        <div class="board-scroll" id="view"></div>
      </main>

      <aside class="drawer" id="drawer" aria-label="Worker detail" hidden></aside>
      <div class="scrim" id="scrim" hidden></div>

      <nav class="pane-switch" aria-label="Panes">
        <button data-action="pane" data-pane="chat">Chat</button>
        <button data-action="pane" data-pane="board">Board <span id="pane-badge"></span></button>
      </nav>
    </div>
    <div id="modal-root"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
